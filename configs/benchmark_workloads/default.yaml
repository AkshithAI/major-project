# Default Benchmark Workloads
# Each workload defines a prompt, context length, and output token count.

workloads:
  - name: short_general
    description: "Short general knowledge prompt (~2K context)"
    context_length: 2048
    output_tokens: 128
    prompt: >
      Write a comprehensive explanation of how heterogeneous CPU and GPU
      computing works for large language model inference, covering memory
      management, layer placement, and speculative decoding.

  - name: medium_technical
    description: "Medium technical explanation (~8K context)"
    context_length: 8192
    output_tokens: 128
    prompt: >
      You are an expert in computer architecture and machine learning systems.
      Explain in detail how modern large language models perform inference on
      consumer hardware with limited GPU memory. Cover the following topics:
      1. How transformer attention mechanisms work and their memory requirements
      2. The role of KV cache and how its size scales with context length
      3. GPU layer offloading strategies — when to place layers on GPU vs CPU
      4. Quantization formats (FP16, Q8_0, Q4_K_M) and their trade-offs
      5. Speculative decoding with a smaller draft model
      6. Memory bandwidth bottlenecks on PCIe buses
      Provide specific numbers and formulas where applicable.

  - name: medium_creative
    description: "Medium creative writing (~8K context)"
    context_length: 8192
    output_tokens: 256
    prompt: >
      Write a detailed short story about a computer scientist who discovers
      that their AI system has learned to optimize its own inference pipeline.
      The story should explore themes of efficiency, intelligence, and the
      boundary between tool and creator. Include technical details about
      GPU memory management and model quantization woven naturally into
      the narrative.

  - name: long_analysis
    description: "Long analytical prompt (~16K context)"
    context_length: 16384
    output_tokens: 256
    prompt: >
      Provide an exhaustive technical analysis comparing the following
      approaches to running large language models on consumer hardware:

      Approach 1: Full GPU Offloading
      - All model layers on GPU
      - KV cache in VRAM
      - Limited by VRAM capacity

      Approach 2: Hybrid CPU-GPU Split
      - Critical layers on GPU, remainder on CPU
      - KV cache optionally offloaded to system RAM
      - Requires efficient PCIe transfer

      Approach 3: CPU-Only with Optimizations
      - All layers on CPU with AVX2/AVX-512 SIMD
      - Large system RAM as advantage
      - No VRAM constraints

      Approach 4: Speculative Decoding
      - Small draft model on CPU
      - Large target model on GPU
      - Acceptance/rejection verification overhead

      For each approach, analyze:
      a) Memory requirements for a 14B parameter Q4_K_M model
      b) Expected throughput in tokens per second
      c) Time to first token (TTFT)
      d) Scaling behavior with context length
      e) Optimal hardware configurations
      f) When this approach is preferred over alternatives

      Conclude with a decision framework for selecting the best approach
      given specific hardware constraints.
